[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Old Squarespace addresses that changed
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/cyber"
  to = "/dailycyberreport"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

# Keystatic GitHub mode requires a branch segment; retain old Studio bookmarks.
[[redirects]]
  from = "/keystatic/collection/*"
  to = "/keystatic/branch/main/collection/:splat"
  status = 302

[[redirects]]
  from = "/keystatic/singleton/*"
  to = "/keystatic/branch/main/singleton/:splat"
  status = 302

[[headers]]
  for = "/vendor/craft/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=31536000, immutable"
