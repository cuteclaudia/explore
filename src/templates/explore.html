<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore by Claudia — Travel, Photography &amp; Perspective</title><meta name="description" content="Explore by Claudia: journeys, photography, places and journal writing, alongside Claudia Gilbert’s strategy and security writing."><link rel="icon" href="/favicon.svg">
<style>
:root{--bg:#f4f3ee;--ink:#233a32;--accent:#376b5c;--surface:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui}button,a,input{font:inherit}button,a{cursor:pointer}a{color:inherit;text-decoration:none}button{border:1px solid #b8c2b8;border-radius:30px;padding:10px 20px;background:var(--surface);color:var(--ink)}button:hover,a:hover{opacity:.8}button.active,.primary{background:var(--accent);color:white}main{min-height:75vh}.hero{position:relative;height:610px;display:flex;align-items:center;color:white;background:linear-gradient(90deg,#12261dcc,#12261d10),url('/images/dolomites-dusk.jpg') center/cover}.hero div{max-width:760px;padding:5vw}h1,h2,h3{font-family:Georgia;font-weight:400;line-height:1.1}h1{font-size:clamp(46px,6vw,78px);margin:20px 0}h2{font-size:42px}h3{font-size:25px;margin:12px 0}p{max-width:640px}.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase}.wrap{max-width:1300px;margin:auto;padding:50px 5%}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.card{background:var(--surface);border-radius:10px;overflow:hidden}.card img{width:100%;height:250px;object-fit:cover;display:block}.card .body{padding:24px}.muted{opacity:.65}.tags{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.split{display:grid;grid-template-columns:2fr 1fr;gap:25px}.map{position:relative;min-height:500px;border-radius:12px;overflow:hidden;background:#dce4d9;background-image:repeating-linear-gradient(23deg,transparent,transparent 70px,#b6c6b944 71px,#b6c6b944 74px),repeating-linear-gradient(115deg,transparent,transparent 110px,#fff8 112px,#fff8 116px)}.land{position:absolute;background:#b9cbb4;border:2px solid #97b29d;border-radius:45% 30% 40% 20%;width:63%;height:70%;left:12%;top:12%;transform:rotate(-12deg)}.map-label{position:absolute;left:32%;top:45%;font:italic 35px Georgia;opacity:.3}.pin{position:absolute;width:40px;height:40px;padding:0;background:var(--accent);color:white;border:3px solid white;box-shadow:0 3px 10px #0003}.map-note{position:absolute;bottom:10px;left:16px;background:white;padding:5px 12px;font-size:12px}.avatar{width:110px!important;height:110px!important;border-radius:50%;object-fit:cover}.profile{display:flex;gap:28px;align-items:center;margin-bottom:40px}input[type=color]{width:100%;height:70px;border:0;padding:0;background:none}.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}label{display:block}dialog{border:0;border-radius:12px;max-width:90vw;background:var(--bg);color:var(--ink)}dialog::backdrop{background:#000c}dialog img{max-height:72vh;max-width:85vw;display:block}.status{min-height:25px}.gallery img{cursor:zoom-in}.banner{font-size:12px;text-align:center;padding:6px;background:var(--ink);color:var(--bg)}@media(max-width:750px){.grid,.split{grid-template-columns:1fr}.hero{height:540px}.swatches{grid-template-columns:1fr 1fr}.heading{align-items:flex-start;flex-direction:column}.wrap{padding:35px 5%}h2{font-size:34px}}
.writing-filters{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:6px}.writing-filters button{flex-shrink:0}
</style><body><main id="app"></main><dialog id="lightbox"><form method="dialog"><button aria-label="Close photograph">Close ✕</button></form><img id="large" alt=""><p id="caption"></p></dialog>
<script>
const places=[{name:'The Three Sisters',region:'Blue Mountains, NSW',type:'Lookout',img:'blue-mountains',text:'Sandstone towers above endless blue-green valleys.',x:68,y:60,credit:'Celia Ferreira'},{name:'Sunrise at the Twelve Apostles',region:'Great Ocean Road, VIC',type:'Coastal',img:'twelve-apostles',text:'First light and salt air along the southern coast.',x:52,y:78,credit:'Kaiser Concha'},{name:'Torres del Paine',region:'Patagonia, Chile',type:'Hiking',img:'torres',text:'Granite spires, glacial lakes and wide open trails.',x:22,y:48,credit:'William Warby'}];
const app=document.querySelector('#app');const photo=p=>`/images/${p.img}.jpg`;const card=(p,i)=>`<article class="card"><img src="${photo(p)}" alt="${p.name}" loading="lazy"><div class="body"><span class="eyebrow">${p.region}</span><h3>${p.name}</h3><p>${p.text}</p><a href="#map/${i}">Explore this place &#8599;</a><p class="muted" style="font-size:11px">Photo: ${p.credit} / Pexels</p></div></article>`;
function stratWatchCard(){return `<aside class="stratwatch-preview" aria-label="StratWatch website"><div class="stratwatch-mark" aria-hidden="true">SW</div><div class="stratwatch-copy"><span class="eyebrow">Also by Claudia</span><h2>StratWatch</h2><p>Real-time OSINT monitoring across geopolitics, cyber, finance and space, drawing on public sources.</p><small>Core access without a login or paywall.</small><small>Monitoring &amp; awareness · www.stratwatch.net</small></div><a href="https://www.stratwatch.net" target="_blank" rel="noopener noreferrer">Visit StratWatch <span aria-hidden="true">→</span><span class="stratwatch-sr"> (opens in a new tab)</span></a></aside>`}
function home(){app.innerHTML=`<section class="hero"><div><span class="eyebrow">Travel · Photography · Adventure</span><h1>Your world.<br>Your own way.</h1><p>For the places that stay with you. The stories you bring back. And the people you meet along the way.</p><a href="#map"><button class="primary">Find your next adventure &#8599;</button></a> <a href="#photography"><button>Through the lens</button></a></div></section><section class="wrap"><div class="heading"><div><span class="eyebrow">A little inspiration</span><h2>Somewhere worth finding.</h2></div><a href="#map">Explore all places →</a></div><div class="grid">${places.map(card).join('')}</div></section><section class="wrap" id="writing-home"></section><section class="wrap"><div class="card body" style="padding:40px"><span class="eyebrow">The stories between places</span><h2>A journal of the journey.</h2><p>Travel notes, moments from the trail, and the stories that come home with me.</p><a href="/journal"><button class="primary">Read my journal →</button></a></div></section>`;loadWritingHome()}
function mapPage(selected=0){app.innerHTML=`<section class="wrap"><span class="eyebrow">Places, remembered</span><h1>The world is waiting.</h1><p>Choose a marker or filter the places below. This illustrated discovery map shows approximate regions, not navigation coordinates.</p><div class="tags" id="filters">${['All','Lookout','Coastal','Hiking'].map((x,i)=>`<button class="${i===0?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><div class="split"><div class="map" aria-label="Illustrated places map"><div class="land"></div><span class="map-label">Places to remember</span>${places.map((p,i)=>`<button class="pin" data-place="${i}" style="left:${p.x}%;top:${p.y}%" aria-label="Show ${p.name}">${i+1}</button>`).join('')}<span class="map-note">Illustrated map · Locations are approximate</span></div><div id="detail" aria-live="polite"></div></div></section>`;detail(selected);document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>detail(+b.dataset.place));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-place]').forEach(x=>x.hidden=b.dataset.filter!=='All'&&places[+x.dataset.place].type!==b.dataset.filter);detail(Math.max(0,places.findIndex(p=>p.type===b.dataset.filter)))});}
function detail(i){document.querySelector('#detail').innerHTML=card(places[i],i)}
async function gallery(){app.innerHTML=`<section class="wrap"><span class="eyebrow">Through the lens</span><h1>Light. Landscape. Place.</h1><p>Photographs, stories and the places behind them.</p><a href="/photography">All photography collections →</a><div class="grid gallery" id="photos"><p role="status">Loading photography…</p></div></section>`;const target=document.querySelector('#photos');try{const data=await loadContent();if(!target.isConnected)return;target.innerHTML=data.galleries.length?data.galleries.map(g=>`<a class="card" href="${escapeHTML(g.href)}">${g.photos[0]?`<img src="${escapeHTML(g.photos[0].image)}" alt="${escapeHTML(g.photos[0].alt)}">`:''}<div class="body"><h3>${escapeHTML(g.title)}</h3><p>${g.photos.length} photographs</p></div></a>`).join(''):'<p>New photography collections are on their way.</p>';}catch{target.innerHTML='<p>Photography could not be loaded. <a href="/photography">Open photography →</a></p>';}}
function drawPhotos(which){const images=places.map((p,i)=>({...p,i})).filter(p=>which<0||p.i===which);document.querySelector('#photos').innerHTML=images.map(p=>`<article class="card"><button style="padding:0;border:0;border-radius:0;width:100%" data-photo="${p.i}" aria-label="Enlarge ${p.name}"><img src="${photo(p)}" alt="${p.name}"></button><div class="body"><h3>${p.name}</h3><span>${p.region}</span><p class="muted">${p.credit} / Pexels</p></div></article>`).join('');document.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{let p=places[+b.dataset.photo];document.querySelector('#large').src=photo(p);document.querySelector('#large').alt=p.name;document.querySelector('#caption').textContent=`${p.name} · ${p.credit} / Pexels`;document.querySelector('#lightbox').showModal()})}
const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let contentPromise;
function loadContent(){return contentPromise ||= fetch('/prototype-content.json').then(r=>{if(!r.ok)throw Error('Could not load writing');return r.json()}).catch(e=>{contentPromise=null;throw e})}
const articleCard=(item,type)=>`<article class="card"><div class="body"><span class="eyebrow">${escapeHTML(type)} · ${new Date(item.date).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'})}</span><h3><a href="${escapeHTML(item.href)}">${escapeHTML(item.title)}</a></h3>${item.tags?.length?`<div class="tags">${item.tags.map(tag=>`<a href="/tags?tag=${encodeURIComponent(tag)}">${escapeHTML(tag)}</a>`).join(' · ')}</div>`:''}${item.summary?`<p>${escapeHTML(item.summary.length>230?item.summary.slice(0,230)+'…':item.summary)}</p>`:''}<a href="${escapeHTML(item.href)}">Read ${type==='China Series'?'essay':'report'} →</a></div></article>`;
async function loadWritingHome(){const target=document.querySelector('#writing-home');if(!target)return;target.innerHTML='<p role="status">Loading Claudia’s writing…</p>';try{const data=await loadContent();if(!target.isConnected)return;target.innerHTML=`<div class="heading"><div><span class="eyebrow">By Claudia Gilbert</span><h2>Strategy, security & perspective.</h2></div><a href="#writing">All writing & analysis →</a></div><p>The China Series, Cyber Briefs and weekly OSINT Brief, alongside the journeys and photography of Explore.</p><div class="grid">${data.essays.slice(0,2).map(x=>articleCard(x,'China Series')).join('')}${data.reports.slice(0,1).map(x=>articleCard(x,'Cyber report')).join('')}</div>${stratWatchCard()}`}catch(e){target.innerHTML='<p>Writing could not be loaded. <a href="/chinaseries">Read the China Series</a> or <a href="/dailycyberreport">cyber reports</a>.</p>'+stratWatchCard()}}
async function writing(){
 app.innerHTML=`<section class="wrap"><span class="eyebrow">Claudia Gilbert · Research & analysis</span><h1>Strategy. Security.<br>A wider perspective.</h1><p>Essays on Chinese strategic culture, cyber threat reporting and weekly open-source intelligence briefs.</p>${stratWatchCard()}<div class="tags writing-filters" aria-label="Writing categories"></div><label for="writing-search">Search writing</label><input id="writing-search" type="search" placeholder="Search titles and summaries" style="padding:12px;width:min(100%,600px);margin:12px 0 24px"><p id="writing-count" role="status">Loading writing…</p><div class="grid" id="writing-results"></div></section>`;
 const target=document.querySelector('#writing-results');let data;
 try{data=await loadContent()}catch(e){if(target.isConnected){target.innerHTML='<p>Unable to load writing. <a href="/chinaseries">Browse essays</a>.</p>';document.querySelector('#writing-count').textContent='';}return;}
 if(!target.isConnected)return;
 const categories=data.categories||[{id:'essays',name:'China Series'},{id:'reports',name:'Cyber Briefs'},{id:'osint',name:'OSINT Brief'}];
 const names=new Map(categories.map(c=>[c.id,c.name]));
 document.querySelector('.writing-filters').innerHTML=[{id:'all',name:'All Writing'},...categories].map(c=>`<button data-writing="${escapeHTML(c.id)}" class="${c.id==='all'?'active':''}" aria-pressed="${c.id==='all'}">${escapeHTML(c.name)}</button>`).join('');
 let filter='all';
 const allItems=[...data.essays.map(x=>({...x,category:x.category||'essays'})),...data.reports.map(x=>({...x,category:x.category||'reports'})),...(data.osint||[]).map(x=>({...x,category:x.category||'osint'}))];
 const draw=()=>{const q=document.querySelector('#writing-search').value.toLowerCase();const items=allItems.filter(x=>filter==='all'||x.category===filter).filter(x=>(x.title+' '+x.summary+' '+(x.tags||[]).join(' ')).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));document.querySelector('#writing-count').textContent=items.length+' items';target.innerHTML=items.length?items.map(x=>articleCard(x,names.get(x.category)||'Writing')).join(''):'<p>No matching articles. Try another search.</p>';};
 document.querySelector('#writing-search').oninput=draw;
 document.querySelectorAll('[data-writing]').forEach(b=>b.onclick=()=>{filter=b.dataset.writing;document.querySelectorAll('[data-writing]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b));});draw();});draw();
}
const defaults=['#f4f3ee','#233a32','#376b5c','#ffffff'];let colours=window.exploreTheme.read();function apply(){window.exploreTheme.apply(colours)}apply();
function palette(){app.innerHTML=`<section class="wrap"><span class="eyebrow">Make yourself at home</span><h1>Your world. Your colours.</h1><p>Build a palette inspired by somewhere you love. Changes preview across the website; save to remember them in this browser.</p><div class="tags">${['Alpine','Sakura Pink','Coastal','Desert','Midnight'].map(x=>`<button data-preset="${x}">${x}</button>`).join('')}</div><div class="swatches">${['Background','Text','Accent','Cards'].map((x,i)=>`<label>${x}<input type="color" aria-label="${x} colour" data-colour="${i}" value="${colours[i]}"><span id="hex${i}">${colours[i]}</span></label>`).join('')}</div><div class="tags"><button class="primary" id="save">Save my palette</button><button id="reset">Reset to Alpine</button><button id="export">Download palette</button></div><p class="status" role="status" id="status"></p><article class="card"><div class="body"><span class="eyebrow">Live preview</span><h2>A place that feels like you.</h2><p>Your palette follows you through Explore. Choose readable text and background colours.</p><button class="primary">Your accent colour</button></div></article></section>`;document.querySelectorAll('[data-colour]').forEach(b=>b.oninput=()=>{colours[+b.dataset.colour]=b.value;apply();document.querySelector('#hex'+b.dataset.colour).textContent=b.value});document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{colours=({Alpine:defaults,'Sakura Pink':['#fff2f6','#4a293a','#a83f6b','#fffafd'],Coastal:['#eef5f7','#16303f','#1a7a96','#ffffff'],Desert:['#f7f0e5','#3a2820','#a55e42','#fffbf5'],Midnight:['#121924','#eef2f6','#426984','#1b2533']})[b.dataset.preset].slice();apply();palette()});document.querySelector('#save').onclick=()=>{localStorage.setItem('explore-colours',JSON.stringify(colours));document.querySelector('#status').textContent='Palette saved in this browser.'};document.querySelector('#reset').onclick=()=>{colours=defaults.slice();localStorage.removeItem('explore-colours');localStorage.removeItem('palette');apply();palette()};document.querySelector('#export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(Object.fromEntries(['background','text','accent','surface'].map((x,i)=>[x,colours[i]])),null,2)],{type:'application/json'}));a.href=u;a.download='explore-palette.json';a.click();URL.revokeObjectURL(u)}}
function route(){if(location.hash==='#palette'){location.replace('/settings#appearance');return;}if(/^#(?:confirmation_token|recovery_token|invite_token|email_change_token|access_token)=/.test(location.hash)){location.replace('/studio/login'+location.hash);return;}const [page,id]=location.hash.slice(1).split('/');if(page==='map'){location.replace('/places'+(id?'?place='+encodeURIComponent(id):''));return;}({home, writing, map:()=>mapPage(Math.min(2,Math.max(0,Number(id)||0))),photography:gallery,palette}[page]||home)();window.scrollTo(0,0)}window.addEventListener('hashchange',route);route();
</script></body></html>
